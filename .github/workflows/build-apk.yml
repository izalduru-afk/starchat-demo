name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org app.starchat --project-name starchat_demo .

      - name: Set app name to StarChat
        run: sed -i 's/android:label="[^"]*"/android:label="StarChat"/' android/app/src/main/AndroidManifest.xml

      - name: Install packages
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk StarChat-demo.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarChat-demo-apk
          path: StarChat-demo.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-${{ github.run_number }}
          name: StarChat Demo (build ${{ github.run_number }})
          make_latest: true
          body: |
            Demo APK for presentation. Sample data only — messages are not sent to other phones.
            Download **StarChat-demo.apk** below and install it on an Android phone
            (allow "Install unknown apps" when asked).
          files: StarChat-demo.apk
